<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hanzi Markdown Visualizer</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Config for Dark Mode -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        'noto-sans': ['"Noto Sans SC"', 'sans-serif'],
                        'noto-serif': ['"Noto Serif SC"', 'serif'],
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Transition Utilities */
        .transition-theme {
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }
        
        /* Font classes handled dynamically via JS styles, but base classes here */
        .font-hanzi-sans { font-family: "Noto Sans SC", sans-serif; }
        .font-hanzi-serif { font-family: "Noto Serif SC", serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100 transition-theme min-h-screen flex flex-col font-sans overflow-x-hidden">

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-white/80 dark:bg-gray-900/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 px-4 py-3 md:px-6 md:py-4 flex items-center justify-between shadow-sm">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white font-serif font-bold text-2xl shadow-lg shadow-blue-600/20">
                文
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight">Hanzi Study</h1>
                <p class="text-xs text-gray-500 dark:text-gray-400">Markdown Visualizer</p>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <!-- Mode Switcher -->
            <div class="hidden md:flex bg-gray-100 dark:bg-gray-800 p-1 rounded-lg mr-2">
                <button id="btn-mode-view" class="flex items-center gap-2 px-3 py-1.5 rounded-md text-sm font-medium transition-all" onclick="app.setMode('view')">
                    <i data-lucide="book-open" class="w-4 h-4"></i> Study
                </button>
                <button id="btn-mode-input" class="flex items-center gap-2 px-3 py-1.5 rounded-md text-sm font-medium transition-all" onclick="app.setMode('input')">
                    <i data-lucide="edit-3" class="w-4 h-4"></i> Input
                </button>
            </div>
            
            <!-- Mobile Mode Switcher (Icon only) -->
            <button id="btn-mode-mobile" class="md:hidden p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800" onclick="app.toggleMode()">
                <i id="icon-mode-mobile" data-lucide="edit-3" class="w-5 h-5 text-gray-600 dark:text-gray-400"></i>
            </button>

            <!-- Theme Toggle -->
            <button class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-600 dark:text-gray-400 transition-colors" onclick="app.toggleTheme()">
                <i id="icon-theme" data-lucide="moon" class="w-5 h-5"></i>
            </button>
            
            <!-- Settings Toggle -->
            <button id="btn-settings" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-600 dark:text-gray-400 transition-colors" onclick="app.toggleSettings()">
                <i data-lucide="settings" class="w-5 h-5"></i>
            </button>
        </div>
    </header>

    <!-- Settings Panel -->
    <div id="settings-panel" class="hidden bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 px-6 py-6 grid grid-cols-1 md:grid-cols-3 gap-6 shadow-md relative z-40">
        <!-- Hanzi Size -->
        <div class="space-y-3">
            <label class="text-sm font-medium text-gray-500 dark:text-gray-400 flex items-center justify-between">
                <span class="flex items-center gap-2"><i data-lucide="type" class="w-4 h-4"></i> Hanzi Size</span>
                <span id="label-hanzi-size" class="text-xs bg-gray-100 dark:bg-gray-700 px-2 py-0.5 rounded">54px</span>
            </label>
            <input type="range" id="input-hanzi-size" min="24" max="128" value="54" class="w-full h-2 bg-gray-200 dark:bg-gray-700 rounded-lg appearance-none cursor-pointer accent-blue-600">
        </div>
        
        <!-- Latin Size -->
        <div class="space-y-3">
            <label class="text-sm font-medium text-gray-500 dark:text-gray-400 flex items-center justify-between">
                <span class="flex items-center gap-2"><i data-lucide="type" class="w-4 h-4"></i> Latin Size</span>
                <span id="label-latin-size" class="text-xs bg-gray-100 dark:bg-gray-700 px-2 py-0.5 rounded">18px</span>
            </label>
            <input type="range" id="input-latin-size" min="12" max="32" value="18" class="w-full h-2 bg-gray-200 dark:bg-gray-700 rounded-lg appearance-none cursor-pointer accent-blue-600">
        </div>

        <!-- Font Style -->
        <div class="space-y-3">
            <label class="text-sm font-medium text-gray-500 dark:text-gray-400">Font Style</label>
            <div class="flex gap-2">
                <button id="btn-font-sans" class="flex-1 py-2 px-3 rounded-md text-sm border font-noto-sans" onclick="app.setFontStyle('sans')">
                    Sans (黑体)
                </button>
                <button id="btn-font-serif" class="flex-1 py-2 px-3 rounded-md text-sm border font-noto-serif" onclick="app.setFontStyle('serif')">
                    Serif (宋体)
                </button>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="flex-1 max-w-5xl mx-auto w-full p-4 md:p-6 lg:p-8 flex flex-col overflow-hidden relative">
        
        <!-- Input View -->
        <div id="view-input" class="hidden flex-1 flex flex-col h-full animate-in fade-in duration-300">
            <div class="mb-4 text-sm text-gray-500 dark:text-gray-400 flex items-center gap-2">
                <i data-lucide="info" class="w-4 h-4"></i>
                <span>Paste markdown. Use <code class="bg-gray-200 dark:bg-gray-700 px-1 rounded text-xs">---</code> to separate cards.</span>
            </div>
            <textarea id="markdown-input" class="flex-1 w-full p-6 rounded-2xl bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500/50 resize-none font-mono text-sm leading-relaxed shadow-sm transition-all text-gray-800 dark:text-gray-200" placeholder="# Paste your markdown here..."></textarea>
        </div>

        <!-- Study View -->
        <div id="view-study" class="flex-1 flex flex-col max-w-3xl mx-auto w-full animate-in fade-in duration-300 relative">
            
            <!-- Progress Bar -->
            <div class="mb-6">
                <div class="flex items-end justify-between mb-2 px-1">
                    <span class="text-xs font-semibold uppercase tracking-wider text-gray-400 dark:text-gray-500">Progress</span>
                    <span class="text-sm font-bold text-gray-700 dark:text-gray-300">
                        <span id="progress-current">1</span> <span class="text-gray-400 font-normal">/ <span id="progress-total">10</span></span>
                    </span>
                </div>
                <div class="w-full h-2 bg-gray-200 dark:bg-gray-700 rounded-full overflow-hidden">
                    <div id="progress-fill" class="h-full bg-blue-600 transition-all duration-300 ease-out" style="width: 0%"></div>
                </div>
            </div>

            <!-- Card Container -->
            <div id="card-container" class="bg-white dark:bg-gray-800 rounded-3xl shadow-xl shadow-gray-200/50 dark:shadow-black/20 border border-gray-100 dark:border-gray-700 overflow-hidden flex flex-col relative transition-colors duration-300 min-h-[400px]">
                
                <!-- Decorative Top Bar -->
                <div class="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r from-blue-500 to-indigo-500 opacity-80"></div>

                <!-- Empty State -->
                <div id="empty-state" class="hidden absolute inset-0 flex flex-col items-center justify-center text-center p-8 text-gray-500 dark:text-gray-400">
                    <i data-lucide="book-open" class="w-12 h-12 mb-4 opacity-20"></i>
                    <p>No cards found.</p>
                    <button onclick="app.setMode('input')" class="mt-4 text-blue-600 hover:underline">Switch to Input Mode</button>
                </div>

                <!-- Card Content -->
                <div id="card-content" class="p-8 md:p-12 space-y-8 flex-1 overflow-y-auto">
                    <!-- Hanzi -->
                    <div class="text-center space-y-4">
                        <p id="card-hanzi" class="text-gray-900 dark:text-white transition-all duration-200 break-words leading-tight"></p>
                    </div>

                    <!-- Divider -->
                    <div class="flex items-center justify-center gap-4 py-2">
                        <div class="h-px bg-gray-200 dark:bg-gray-700 w-12 rounded-full"></div>
                        <div class="w-1.5 h-1.5 bg-blue-500 rounded-full"></div>
                        <div class="h-px bg-gray-200 dark:bg-gray-700 w-12 rounded-full"></div>
                    </div>

                    <!-- Pinyin & Translation -->
                    <div class="space-y-6">
                        <div id="block-pinyin" class="space-y-1">
                            <span class="text-xs font-bold text-blue-600 dark:text-blue-400 uppercase tracking-wider block">Pinyin</span>
                            <p id="card-pinyin" class="text-gray-800 dark:text-gray-200 font-medium leading-relaxed"></p>
                        </div>

                        <div id="block-translation" class="space-y-1">
                            <span class="text-xs font-bold text-emerald-600 dark:text-emerald-400 uppercase tracking-wider block">Translation</span>
                            <p id="card-translation" class="text-gray-600 dark:text-gray-300 italic leading-relaxed"></p>
                        </div>
                    </div>

                    <!-- Extras -->
                    <div id="block-extras" class="hidden mt-8 pt-8 border-t border-dashed border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-400 space-y-2">
                        <!-- Dynamic Content injected here -->
                    </div>
                </div>

                <!-- Footer Hint -->
                <div class="bg-gray-50 dark:bg-gray-800/50 border-t border-gray-100 dark:border-gray-700 px-6 py-3 flex justify-between items-center text-xs text-gray-400">
                    <span id="footer-counter">Card 1 of 1</span>
                    <span class="hidden md:inline-flex items-center gap-2">
                        Use <kbd class="bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded px-1.5 py-0.5 font-mono text-[10px]">←</kbd> <kbd class="bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded px-1.5 py-0.5 font-mono text-[10px]">→</kbd> to navigate
                    </span>
                </div>
            </div>

            <!-- Navigation Buttons -->
            <div class="flex justify-between items-center mt-6 gap-4">
                <button id="btn-prev" onclick="app.prevCard()" class="flex-1 md:flex-none flex items-center justify-center gap-2 px-6 py-3 rounded-xl bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-200 shadow-lg shadow-gray-200/50 dark:shadow-black/20 hover:bg-gray-50 dark:hover:bg-gray-700 disabled:opacity-50 disabled:cursor-not-allowed transition-all active:scale-95">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                    <span class="font-medium">Previous</span>
                </button>

                <button id="btn-next" onclick="app.nextCard()" class="flex-1 md:flex-none flex items-center justify-center gap-2 px-6 py-3 rounded-xl bg-blue-600 text-white shadow-lg shadow-blue-600/30 hover:bg-blue-700 disabled:opacity-50 disabled:bg-gray-300 disabled:shadow-none disabled:text-gray-500 disabled:cursor-not-allowed transition-all active:scale-95">
                    <span class="font-medium">Next</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </main>

    <script>
        const DEFAULT_TEXT = `**綜合路透社等報導，歐盟執委會在車廠與主要汽車大國壓力下去年12月提出新方案，訂出到2035年時所有乘用新車的碳排相較2021年水準減少90%，而非原本規畫的「零排放」，並允許繼續販售混動車及提高燃油效率的引擎，形同撤銷原訂2035年起禁售燃油新車政策。**

**Pinyin:** Zònghé lùtòushè děng bàodǎo, ōuméng zhíwěihuì zài chēchǎng yǔ zhǔyào qìchē dàguó yālì xià qùnián shí'èr yuè tíchū xīn fāng'àn, dìng chū dào èr-líng-sān-wǔ nián shí suǒyǒu chéngyòng xīnchē de tànpái xiāngjiào èr-líng-èr-yī nián shuǐzhǔn jiǎnshǎo jiǔshí bǎifēnzhī, ér fēi yuánběn guīhuà de "líng páifàng", bìng yǔnxǔ jìxù fànshòu hùndòngchē jí tígāo rányóu xiàolǜ de yǐnqíng, xíngtóng chèxiāo yuándìng èr-líng-sān-wǔ nián qǐ jìnshòu rányóu xīnchē zhèngcè.

**Translation:** According to combined reports from Reuters and other sources, the European Commission, under pressure from automakers and major automotive nations, proposed a new plan last December. It sets a target for carbon emissions from all new passenger cars to be reduced by 90% compared to 2021 levels by 2035, rather than the originally planned "zero emissions." It also allows for the continued sale of hybrid vehicles and engines with improved fuel efficiency, which is effectively equivalent to revoking the original policy of banning the sale of new internal combustion engine vehicles starting from 2035.

**Grammar Explanation:**

* **綜合...報導 (Zònghé... bàodǎo):** A common journalistic opening meaning "According to combined reports from..."
* **在...壓力下 (zài... yālì xià):** A circumstantial structure meaning "under the pressure of..."
* **而非 (ér fēi):** A formal conjunction used to contrast two ideas, meaning "and not" or "rather than."
* **形同 (xíngtóng):** A verb used to indicate that one action or situation is virtually the same as another; "amounting to" or "equivalent to."
* **原訂 (yuándìng):** A compound meaning "originally scheduled/decided."

**Core Vocabulary:**

* **執委會 (zhíwěihuì):** Commission / Executive Committee
* **方案 (fāng'àn):** Plan / Proposal / Scheme
* **碳排 (tànpái):** Carbon emissions (short for 碳排放)
* **混動車 (hùndòngchē):** Hybrid vehicle (short for 混合動力車)
* **撤銷 (chèxiāo):** To revoke / To rescind / To cancel

---

**剩餘10%的減排差額規劃透過替代燃料（最多3%）和低碳鋼（最多7%）來彌補，也使得汽車製造商在2035年後仍得以銷售包括燃油和混合動力在內的所有車款。**

**Pinyin:** Shèngyú shí bǎifēnzhī de jiǎnpái chā'é guīhuà tòuguò tìdài ránliào (zuìduō sān bǎifēnzhī) hé dītàngāng (zuìduō qī bǎifēnzhī) lái míbǔ, yě shǐdé qìchē zhìzàoshāng zài èr-líng-sān-wǔ nián hòu réng déyǐ xiāoshòu bāokuò rányóu hé hùnhé dònglì zài nèi de suǒyǒu chēkuǎn.

**Translation:** The remaining 10% emissions reduction gap is planned to be compensated through alternative fuels (up to 3%) and low-carbon steel (up to 7%). This also enables automakers to continue selling all car models, including internal combustion and hybrid vehicles, even after 2035.

**Grammar Explanation:**

* **透過...來... (tòuguò... lái...):** A common pattern indicating the method used to achieve a goal: "By means of [Method] to [Action]."
* **使得 (shǐdé):** A causative verb meaning "to cause" or "to make," often used to describe the result of a previous statement.
* **得以 (déyǐ):** A formal auxiliary verb meaning "to be able to" or "so that one can," usually implying that a condition has been met to allow the action.
* **包括...在內 (bāokuò... zài nèi):** A correlative structure meaning "including... (among them)."

**Core Vocabulary:**

* **差額 (chā'é):** Balance / Difference / Gap
* **替代燃料 (tìdài ránliào):** Alternative fuel
* **彌補 (míbǔ):** To make up for / To compensate / To remedy
* **製造商 (zhìzàoshāng):** Manufacturer
* **車款 (chēkuǎn):** Car model / Vehicle type

---

**非政府組織歐洲運輸環境聯合會抨擊，這是歐盟多年綠色政策的最大幅度倒退，並認為允許較高碳排車款繼續銷售，恐在純電車（BEV）領域進一步被中國車廠拉開領先差距。**

**Pinyin:** Fēi zhèngfǔ zǔzhī ōuzhōu yùnshū huánjìng liánhéhuì pēngjī, zhè shì ōuméng duōnián lǜsè zhèngcè de zuìdà fúdù dàotuì, bìng rènwéi yǔnxǔ jiàogāo tànpái chēkuǎn jìxù xiāoshòu, kǒng zài chúndiànchē (BEV) lǐngyù jìnyībù bèi zhōngguó chēchǎng lākāi lǐngxiān chājù.

**Translation:** The non-governmental organization Transport & Environment (T&E) criticized this as the largest retreat in the EU's green policy in years. They believe that allowing vehicle models with higher carbon emissions to continue being sold may lead to Chinese automakers further widening their lead in the Battery Electric Vehicle (BEV) sector.

**Grammar Explanation:**

* **幅度 (fúdù):** Range or scope; here "最大幅度" (zuìdà fúdù) translates to "the greatest extent" or "largest magnitude."
* **恐 (kǒng):** A formal/written particle used to express a fear, concern, or the likelihood of an undesirable outcome ("it is feared that").
* **進一步 (jìnyībù):** An adverbial phrase meaning "further" or "going one step further."
* **被...拉開 (bèi... lākāi):** A passive construction. "拉開差距" (lākāi chājù) means to widen a gap; the "被" (bèi) indicates that the subject (EU automakers) is the one having the gap widened against them by Chinese manufacturers.

**Core Vocabulary:**

* **抨擊 (pēngjī):** To attack (verbally) / To lambaste / To criticize harshly
* **倒退 (dàotuì):** Regression / Retreat / Setback
* **領域 (lǐngyù):** Field / Domain / Sector
* **差距 (chājù):** Gap / Disparity

---`;

        class HanziApp {
            constructor() {
                // Initialize State
                this.state = {
                    mode: 'view', // 'view' or 'input'
                    text: localStorage.getItem('hanzi_text') || DEFAULT_TEXT,
                    cards: [],
                    currentIndex: 0,
                    showSettings: false,
                    darkMode: localStorage.getItem('hanzi_theme') === 'dark',
                    settings: {
                        hanziSize: parseInt(localStorage.getItem('hanzi_size_h')) || 54, // Default 3x Latin
                        latinSize: parseInt(localStorage.getItem('hanzi_size_l')) || 18,
                        fontStyle: localStorage.getItem('hanzi_font') || 'sans' // 'sans' or 'serif'
                    }
                };

                // DOM Elements
                this.elements = {
                    app: document.body,
                    markdownInput: document.getElementById('markdown-input'),
                    viewInput: document.getElementById('view-input'),
                    viewStudy: document.getElementById('view-study'),
                    settingsPanel: document.getElementById('settings-panel'),
                    btnSettings: document.getElementById('btn-settings'),
                    btnModeView: document.getElementById('btn-mode-view'),
                    btnModeInput: document.getElementById('btn-mode-input'),
                    btnFontSans: document.getElementById('btn-font-sans'),
                    btnFontSerif: document.getElementById('btn-font-serif'),
                    inputHanziSize: document.getElementById('input-hanzi-size'),
                    inputLatinSize: document.getElementById('input-latin-size'),
                    labelHanziSize: document.getElementById('label-hanzi-size'),
                    labelLatinSize: document.getElementById('label-latin-size'),
                    cardHanzi: document.getElementById('card-hanzi'),
                    cardPinyin: document.getElementById('card-pinyin'),
                    cardTranslation: document.getElementById('card-translation'),
                    blockExtras: document.getElementById('block-extras'),
                    progressFill: document.getElementById('progress-fill'),
                    progressCurrent: document.getElementById('progress-current'),
                    progressTotal: document.getElementById('progress-total'),
                    footerCounter: document.getElementById('footer-counter'),
                    btnNext: document.getElementById('btn-next'),
                    btnPrev: document.getElementById('btn-prev'),
                    emptyState: document.getElementById('empty-state'),
                    cardContent: document.getElementById('card-content'),
                    iconTheme: document.getElementById('icon-theme')
                };

                this.init();
            }

            init() {
                // Initial parsing
                this.parseCards();
                
                // Theme Init
                if (this.state.darkMode) document.documentElement.classList.add('dark');
                
                // Event Listeners
                this.setupEventListeners();

                // Initial UI Render
                this.updateModeUI();
                this.updateSettingsUI();
                this.renderCard();
                
                // Initialize Icons
                lucide.createIcons();
            }

            setupEventListeners() {
                // Settings Inputs
                this.elements.inputHanziSize.addEventListener('input', (e) => {
                    this.state.settings.hanziSize = parseInt(e.target.value);
                    this.updateSettingsUI();
                    this.saveSettings();
                });

                this.elements.inputLatinSize.addEventListener('input', (e) => {
                    this.state.settings.latinSize = parseInt(e.target.value);
                    this.updateSettingsUI();
                    this.saveSettings();
                });

                // Markdown Input
                this.elements.markdownInput.value = this.state.text;
                this.elements.markdownInput.addEventListener('input', (e) => {
                    this.state.text = e.target.value;
                    localStorage.setItem('hanzi_text', this.state.text);
                    this.parseCards();
                });

                // Keyboard Navigation
                window.addEventListener('keydown', (e) => {
                    if (this.state.mode === 'input') return;
                    if (e.key === 'ArrowRight') this.nextCard();
                    if (e.key === 'ArrowLeft') this.prevCard();
                });
            }

            parseCards() {
                const blocks = this.state.text.split('---').map(b => b.trim()).filter(b => b.length > 0);
                this.state.cards = blocks.map(block => {
                    const lines = block.split('\n');
                    let hanzi = "", pinyin = "", translation = "", extras = [];
                    let isCapturingExtras = false;

                    lines.forEach(line => {
                        const trimmed = line.trim();
                        if (!trimmed) return;

                        if (trimmed.startsWith('**') && trimmed.endsWith('**') && !trimmed.includes(':') && !hanzi) {
                            hanzi = trimmed.replace(/\*\*/g, '');
                            return;
                        }

                        if (trimmed.toLowerCase().includes('**pinyin:**')) {
                            pinyin = trimmed.replace(/\*\*pinyin:\*\*/i, '').trim();
                            return;
                        }

                        if (trimmed.toLowerCase().includes('**translation:**')) {
                            translation = trimmed.replace(/\*\*translation:\*\*/i, '').trim();
                            return;
                        }

                        if (trimmed.toLowerCase().includes('grammar') || trimmed.toLowerCase().includes('vocabulary')) {
                            isCapturingExtras = true;
                        }

                        if (isCapturingExtras || (!hanzi && !pinyin && !translation)) {
                            extras.push(trimmed);
                        }
                    });

                    return { hanzi, pinyin, translation, extras };
                });

                // Adjust index if out of bounds after edit
                if (this.state.currentIndex >= this.state.cards.length) {
                    this.state.currentIndex = Math.max(0, this.state.cards.length - 1);
                }
                
                this.renderCard(); // Re-render if looking at study view
            }

            toggleTheme() {
                this.state.darkMode = !this.state.darkMode;
                if (this.state.darkMode) {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('hanzi_theme', 'dark');
                    this.elements.iconTheme.setAttribute('data-lucide', 'sun');
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('hanzi_theme', 'light');
                    this.elements.iconTheme.setAttribute('data-lucide', 'moon');
                }
                lucide.createIcons();
            }

            toggleSettings() {
                this.state.showSettings = !this.state.showSettings;
                if (this.state.showSettings) {
                    this.elements.settingsPanel.classList.remove('hidden');
                    this.elements.btnSettings.classList.add('bg-blue-100', 'text-blue-600', 'dark:bg-blue-900', 'dark:text-blue-300');
                } else {
                    this.elements.settingsPanel.classList.add('hidden');
                    this.elements.btnSettings.classList.remove('bg-blue-100', 'text-blue-600', 'dark:bg-blue-900', 'dark:text-blue-300');
                }
            }

            toggleMode() {
                this.setMode(this.state.mode === 'view' ? 'input' : 'view');
            }

            setMode(mode) {
                this.state.mode = mode;
                this.updateModeUI();
                
                // If switching to view, ensure parsing is fresh and we reset index if needed (optional)
                if (mode === 'view') {
                    this.parseCards();
                    this.elements.settingsPanel.classList.add('hidden'); // auto hide settings on view switch
                    this.state.showSettings = false;
                    this.elements.btnSettings.classList.remove('bg-blue-100', 'text-blue-600');
                }
            }

            setFontStyle(style) {
                this.state.settings.fontStyle = style;
                this.updateSettingsUI();
                this.saveSettings();
            }

            saveSettings() {
                localStorage.setItem('hanzi_size_h', this.state.settings.hanziSize);
                localStorage.setItem('hanzi_size_l', this.state.settings.latinSize);
                localStorage.setItem('hanzi_font', this.state.settings.fontStyle);
            }

            updateModeUI() {
                const isView = this.state.mode === 'view';
                
                // Toggle Container Visibility
                if (isView) {
                    this.elements.viewInput.classList.add('hidden');
                    this.elements.viewStudy.classList.remove('hidden');
                } else {
                    this.elements.viewInput.classList.remove('hidden');
                    this.elements.viewStudy.classList.add('hidden');
                }

                // Update Button Styles (Desktop)
                const activeClass = ['bg-white', 'dark:bg-gray-700', 'text-blue-600', 'dark:text-blue-300', 'shadow-sm'];
                const inactiveClass = ['text-gray-600', 'dark:text-gray-400', 'hover:text-gray-900'];

                if (isView) {
                    this.elements.btnModeView.classList.add(...activeClass);
                    this.elements.btnModeView.classList.remove(...inactiveClass);
                    this.elements.btnModeInput.classList.remove(...activeClass);
                    this.elements.btnModeInput.classList.add(...inactiveClass);
                } else {
                    this.elements.btnModeInput.classList.add(...activeClass);
                    this.elements.btnModeInput.classList.remove(...inactiveClass);
                    this.elements.btnModeView.classList.remove(...activeClass);
                    this.elements.btnModeView.classList.add(...inactiveClass);
                }

                // Mobile Icon
                const mobileIcon = document.getElementById('icon-mode-mobile');
                mobileIcon.setAttribute('data-lucide', isView ? 'edit-3' : 'book-open');
                lucide.createIcons();
            }

            updateSettingsUI() {
                const s = this.state.settings;
                
                // Update Inputs
                this.elements.inputHanziSize.value = s.hanziSize;
                this.elements.inputLatinSize.value = s.latinSize;
                this.elements.labelHanziSize.textContent = `${s.hanziSize}px`;
                this.elements.labelLatinSize.textContent = `${s.latinSize}px`;

                // Update Font Style Buttons
                const activeBtn = ['border-blue-500', 'bg-blue-50', 'text-blue-700', 'dark:bg-blue-900/30', 'dark:text-blue-300', 'dark:border-blue-700'];
                const inactiveBtn = ['border-gray-200', 'dark:border-gray-700', 'text-gray-600', 'dark:text-gray-300'];

                if (s.fontStyle === 'sans') {
                    this.elements.btnFontSans.classList.add(...activeBtn);
                    this.elements.btnFontSans.classList.remove(...inactiveBtn);
                    this.elements.btnFontSerif.classList.remove(...activeBtn);
                    this.elements.btnFontSerif.classList.add(...inactiveBtn);
                } else {
                    this.elements.btnFontSerif.classList.add(...activeBtn);
                    this.elements.btnFontSerif.classList.remove(...inactiveBtn);
                    this.elements.btnFontSans.classList.remove(...activeBtn);
                    this.elements.btnFontSans.classList.add(...inactiveBtn);
                }

                // Apply Styles to Content
                this.elements.cardHanzi.style.fontSize = `${s.hanziSize}px`;
                this.elements.cardHanzi.style.fontFamily = s.fontStyle === 'serif' ? '"Noto Serif SC", serif' : '"Noto Sans SC", sans-serif';
                
                this.elements.cardPinyin.style.fontSize = `${s.latinSize + 2}px`;
                this.elements.cardTranslation.style.fontSize = `${s.latinSize}px`;
                this.elements.blockExtras.style.fontSize = `${s.latinSize - 2}px`;
            }

            renderCard() {
                if (this.state.cards.length === 0) {
                    this.elements.emptyState.classList.remove('hidden');
                    this.elements.cardContent.classList.add('hidden');
                    this.elements.btnNext.disabled = true;
                    this.elements.btnPrev.disabled = true;
                    this.updateProgress();
                    return;
                }

                this.elements.emptyState.classList.add('hidden');
                this.elements.cardContent.classList.remove('hidden');

                const card = this.state.cards[this.state.currentIndex];

                // Render Content
                this.elements.cardHanzi.textContent = card.hanzi || "No text found";
                this.elements.cardPinyin.textContent = card.pinyin || "";
                this.elements.cardTranslation.textContent = card.translation || "";

                // Render Extras (HTML)
                if (card.extras && card.extras.length > 0) {
                    this.elements.blockExtras.classList.remove('hidden');
                    this.elements.blockExtras.innerHTML = card.extras.map(line => {
                         const isSubHeader = line.includes('Grammar') || line.includes('Vocabulary');
                         if (isSubHeader) {
                             return `<h4 class="font-bold text-gray-900 dark:text-gray-100 mt-6 first:mt-0 mb-3 text-sm uppercase tracking-wider">${line.replace(/\*\*/g, '').replace(':', '')}</h4>`;
                         }
                         return `<div class="pl-4 border-l-2 border-gray-100 dark:border-gray-700 py-1"><span class="leading-relaxed">${line.replace(/\*\*(.*?)\*\*/g, '<strong class="text-gray-800 dark:text-gray-200 font-semibold">$1</strong>').replace(/^\*\s/, '')}</span></div>`;
                    }).join('');
                } else {
                    this.elements.blockExtras.classList.add('hidden');
                }

                // Nav State
                this.elements.btnPrev.disabled = this.state.currentIndex === 0;
                this.elements.btnNext.disabled = this.state.currentIndex === this.state.cards.length - 1;

                this.updateProgress();
            }

            updateProgress() {
                const total = this.state.cards.length;
                const current = total > 0 ? this.state.currentIndex + 1 : 0;
                
                this.elements.progressCurrent.textContent = current;
                this.elements.progressTotal.textContent = total;
                this.elements.footerCounter.textContent = `Card ${current} of ${total}`;

                const pct = total > 0 ? (current / total) * 100 : 0;
                this.elements.progressFill.style.width = `${pct}%`;
            }

            nextCard() {
                if (this.state.currentIndex < this.state.cards.length - 1) {
                    this.state.currentIndex++;
                    this.renderCard();
                }
            }

            prevCard() {
                if (this.state.currentIndex > 0) {
                    this.state.currentIndex--;
                    this.renderCard();
                }
            }
        }

        // Init App
        const app = new HanziApp();
    </script>
</body>
</html>
